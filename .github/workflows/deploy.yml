name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
        - name: Checkout repo  # Алтернатива: git clone
          uses: actions/checkout@v4  # Используется для клонирования репозитория

        - name: Set up Docker Buildx # Используется для установки Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Login to Docker registry # Используется для входа в Docker registry. Там находится наш образ.
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: Yorionn
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Build and push image # Используется для сборки и пуша образа в Docker registry
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: ghcr.io/yorionn/site:latest